# mise.lock pins each tool's download URL and checksum per platform, so installs need no
# GitHub API lookup. To bump a pin, edit it here, run `mise lock`, and commit both files.
# A major-only pin such as node stays at its locked patch until `mise lock --bump`.
# After `mise lock` and before committing, delete the `provenance.slsa` subtables under
# tools.osv-scanner: its registry entry names no signer, and mise refuses them (seen with
# mise 2026.9.16 and 2026.10.14). A gate test enforces this. Recheck the registry on each
# osv-scanner bump; if it now names a signer, keep the subtables and remove the guard test
# (TestMiseLock in tests/test-repo-hooks.py). Checksums still pin downloads.
[tools]
node = "26"
gitleaks = "8.24.2"
uv = "0.12.22"
osv-scanner = "2.7.0"
