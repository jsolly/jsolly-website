# mise.lock pins each tool's download URL and checksum per platform, so installs need no
# GitHub API lookup. To bump a pin, edit it here, run `mise lock`, and commit both files.
# A major-only pin such as node stays at its locked patch until `mise lock --bump`.
# After `mise lock`, delete any `provenance.slsa` subtable: newer mise (2026.9.16, 2026.10.14)
# refuses to install from one whose registry entry names no signer; checksums still pin downloads.
[tools]
node = "26"
gitleaks = "8.24.2"
uv = "0.12.22"
osv-scanner = "2.7.0"
