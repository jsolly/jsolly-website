name: CI
run-name: >-
  ${{ ((github.event_name != 'pull_request' ||
  (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
  (github.event.action == 'labeled' && github.event.label.name == 'ow-ci')) &&
  !(github.event_name == 'pull_request' &&
  github.event.pull_request.draft &&
  github.event.pull_request.head.repo.full_name == github.repository &&
  github.event.pull_request.user.type == 'User' &&
  github.event.pull_request.user.login != 'dependabot[bot]' &&
  contains(github.event.pull_request.labels.*.name, 'preview'))) && format('{0} validation', github.workflow) || 'Deferred validation' }}

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review, converted_to_draft]
  push:
    branches: [main]

# The event_name suffix keeps a workflow_dispatch of CI on main (ensure-main-ci, humans) from
# cancelling the push run that a push-only Deploy follows via workflow_run.
# A newer main push still cancels an older one: the newer run's scan starts from main's nearest
# green push run, so it rescans the cancelled commit. Where a Deploy follows CI (aws-sam), an older
# run left to finish would queue a Deploy that refuses as stale.
concurrency:
  group: >-
    ${{ ((github.event_name != 'pull_request' ||
    (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
    (github.event.action == 'labeled' && github.event.label.name == 'ow-ci')) &&
    !(github.event_name == 'pull_request' &&
    github.event.pull_request.draft &&
    github.event.pull_request.head.repo.full_name == github.repository &&
    github.event.pull_request.user.type == 'User' &&
    github.event.pull_request.user.login != 'dependabot[bot]' &&
    contains(github.event.pull_request.labels.*.name, 'preview'))) && format('ci-{0}-{1}-{2}', github.workflow, github.event.pull_request.number || github.ref, github.event_name) || format('deferred-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  prepare:
    if: >-
      ((github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event.action == 'labeled' && github.event.label.name == 'ow-ci')) &&
      !(github.event_name == 'pull_request' &&
      github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'User' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'preview')))
    runs-on: ubuntu-24.04-arm
    outputs:
      tree: ${{ steps.verified-tree.outputs.tree }}
      run_full: ${{ steps.verified-tree.outputs.run_full || 'true' }}
    steps:
      # Keep full history: Secrets scan (range) below scans a commit range, not just the checked-out tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Nothing but the checkout runs before the scan: an earlier step could rewrite the git config,
      # PATH, or environment the scan reads history with.
      - name: Secrets scan (range)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-secrets-scan.sh
      - name: Check for a validated PR tree
        id: verified-tree
        timeout-minutes: 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-verified-tree.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: steps.verified-tree.outputs.run_full != 'false'
        with:
          version: "0.12.22"
          enable-cache: false
      - run: npm ci
        if: steps.verified-tree.outputs.run_full != 'false'
      # Compiled bytecode requires a trusted producer; checksum validation
      # detects staleness/corruption, not a malicious cache from an earlier PR commit.
      - name: Restore compilation and test-order metadata
        if: >-
          steps.verified-tree.outputs.run_full != 'false' &&
          (github.ref == 'refs/heads/main' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login == github.repository_owner))
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/node-compile-cache
            node_modules/.vite/vitest/**/results.json
          key: ci-runtime-v5-prepare-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ci-runtime-v5-prepare-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}-
      - name: Run repository preparation
        if: steps.verified-tree.outputs.run_full != 'false'
        env:
          JSOLLY_INSTALL_BROWSER: "1"
          TEST_FILE_TIMINGS: "1"
          TEST_FILE_TIMINGS_DIR: ${{ runner.temp }}/test-file-timings
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: |
          mkdir -p "$TEST_FILE_TIMINGS_DIR"
          echo "checkout=$(git rev-parse HEAD) tree=$(git rev-parse 'HEAD^{tree}')" | tee "$TEST_FILE_TIMINGS_DIR/source.txt"
          bash scripts/ci-prepare.sh
      - name: Preserve test file timings
        if: always() && steps.verified-tree.outputs.run_full != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-file-timings-prepare-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-file-timings
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve immutable build output
        if: success() && steps.verified-tree.outputs.run_full != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-build-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ci-build/manifest.json
            ${{ runner.temp }}/ci-build/build.json.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Preserve coverage manifest
        if: success() && steps.verified-tree.outputs.run_full != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-manifest-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-build/manifest.json
          if-no-files-found: error
          retention-days: 1
      - name: Record authoritative preparation decision
        env:
          RUN_FULL: ${{ steps.verified-tree.outputs.run_full || 'true' }}
        run: node scripts/ci-gate.mjs record-preparation "$RUN_FULL"
      - name: Preserve preparation decision
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-preparation-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-build/preparation.json
          if-no-files-found: error
          retention-days: 1

  built:
    if: >-
      ((github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event.action == 'labeled' && github.event.label.name == 'ow-ci')) &&
      !(github.event_name == 'pull_request' &&
      github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'User' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'preview')))
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secrets scan (range)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-secrets-scan.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Restore compilation and test-order metadata
        if: >-
          github.ref == 'refs/heads/main' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login == github.repository_owner)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/node-compile-cache
            node_modules/.vite/vitest/**/results.json
          key: ci-runtime-v5-built-${{ matrix.shard }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ci-runtime-v5-built-${{ matrix.shard }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}-
      - run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: Await successful preparation from this attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-ci-preparation.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-preparation-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-build
      - name: Verify authoritative preparation decision
        id: preparation
        run: node scripts/ci-gate.mjs select-preparation
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: steps.preparation.outputs.run_full == 'true'
        with:
          name: ci-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-build
      - name: Run built shard
        if: steps.preparation.outputs.run_full == 'true'
        env:
          SHARD: ${{ matrix.shard }}
          TEST_FILE_TIMINGS: "1"
          TEST_FILE_TIMINGS_DIR: ${{ runner.temp }}/test-file-timings
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: node scripts/ci-gate.mjs shard "$SHARD"
      - name: Audit built pages with axe-core
        if: steps.preparation.outputs.run_full == 'true' && matrix.shard == 1
        run: npm run check:a11y
      - name: Save accessibility findings
        if: always() && matrix.shard == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: accessibility-results
          path: accessibility-results.json
          if-no-files-found: ignore
      - name: Preserve shard evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-built-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-report-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve test file timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-file-timings-built-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-file-timings
          if-no-files-found: warn
          retention-days: 14

  ci:
    name: >-
      ${{ ((github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event.action == 'labeled' && github.event.label.name == 'ow-ci')) &&
      !(github.event_name == 'pull_request' &&
      github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'User' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'preview'))) && 'ci' || 'ci-deferred' }}
    if: >-
      always() && ((github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event.action == 'labeled' && github.event.label.name == 'ow-ci')) &&
      !(github.event_name == 'pull_request' &&
      github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'User' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'preview')))
    needs: [prepare, built]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secrets scan (range)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-secrets-scan.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.prepare.outputs.run_full != 'false' && needs.prepare.result == 'success' && needs.built.result == 'success'
        with:
          name: ci-manifest-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.prepare.outputs.run_full != 'false' && needs.prepare.result == 'success' && needs.built.result == 'success'
        with:
          pattern: ci-built-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-reports
      - name: Validate complete coverage or protected tree reuse
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-gate.mjs aggregate
      - name: Record validated PR tree
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-tree-v1-ci-${{ needs.prepare.outputs.tree }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-tree-ci.txt
          if-no-files-found: error
          retention-days: 7
