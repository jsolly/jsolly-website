name: Production smoke
# Every deployment status (pending, in_progress, success, inactive) starts a run; only success and manual runs
# carry the title /ship's follower discovers, so it never follows a skipped sibling.
run-name: ${{ github.event_name == 'schedule' && format('Production daily smoke {0}', github.run_id) || github.event_name == 'workflow_dispatch' && format('Production smoke {0} {1}', inputs.release_sha, inputs.request_id) || (github.event.deployment_status.state == 'success' && format('Production smoke {0} {1}', github.event.deployment.sha, github.event.deployment.id)) || format('Production smoke status {0} {1}', github.event.deployment_status.state, github.event.deployment.id) }}
on:
  deployment_status:
  schedule:
    - cron: "47 10 * * *"
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full SHA of the production release to verify
        required: true
        type: string
      request_id:
        description: Unique UUID for this verification request
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-smoke-${{ github.event.deployment.id || inputs.request_id || github.run_id }}-${{ github.event.deployment_status.state || 'manual' }}
  cancel-in-progress: false
jobs:
  smoke:
    # Substitute the production environment, status URL prefix and host's deployment creator.
    # Project-qualified production environments still require this project's status URL.
    if: >-
      ((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main') ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.creator.login == 'vercel[bot]' &&
       (github.event.deployment.ref == 'main' ||
        github.event.deployment.ref == 'refs/heads/main' ||
        github.event.deployment.ref == github.event.deployment.sha) &&
       (github.event.deployment.environment == 'Production' ||
        startsWith(github.event.deployment.environment, 'Production – ')) &&
       startsWith(github.event.deployment_status.environment_url, 'https://jsolly-website-'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    outputs:
      release-sha: ${{ steps.scheduled-release.outputs.sha || github.event.deployment.sha || inputs.release_sha }}
    env:
      PRODUCTION_SMOKE_RELEASE_SHA: ${{ github.event.deployment.sha || inputs.release_sha }}
      PRODUCTION_SMOKE_REQUEST_ID: ${{ github.event.deployment.id || inputs.request_id }}
    steps:
      - name: Resolve the current production release for the daily check
        if: github.event_name == 'schedule'
        id: scheduled-release
        shell: bash
        run: |
          set -euo pipefail
          release_file=$(mktemp)
          trap 'rm -f "$release_file"' EXIT
          status=$(curl --fail --silent --show-error --max-time 20 --max-filesize 1024 \
            --proto '=https' --output "$release_file" --write-out '%{http_code}' \
            --header 'Cache-Control: no-cache' https://www.jsolly.com/release.json)
          [[ "$status" == 200 ]] || exit 1
          jq -e 'type == "object" and keys == ["sha"]' "$release_file" >/dev/null
          sha=$(jq -er '.sha | strings | select(test("^[0-9a-f]{40}$"))' "$release_file")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "PRODUCTION_SMOKE_RELEASE_SHA=$sha" >> "$GITHUB_ENV"
          echo "PRODUCTION_SMOKE_REQUEST_ID=daily-${{ github.run_id }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The deployed commit's scenario, so a later merge's assertions never test an older build.
          ref: ${{ steps.scheduled-release.outputs.sha || github.event.deployment.sha || inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release belongs to main
        run: |
          [[ "$PRODUCTION_SMOKE_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git merge-base --is-ancestor "$PRODUCTION_SMOKE_RELEASE_SHA" origin/main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            .nvmrc
            package-lock.json
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run smoke:scenario-contract
      - run: npm run smoke:production
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: production-smoke-${{ env.PRODUCTION_SMOKE_REQUEST_ID }}
          path: production-smoke-artifacts/
          if-no-files-found: warn
          retention-days: 14

  report:
    # Scheduled and manual runs on main report to shared-infra's scheduled-checks
    # log group (docs/shared-infra.md): a failure pages through the shared error
    # alarm, and a missing daily heartbeat through this check's own alarm. Those
    # triggers mint the main-branch subject the reporting role trusts; a
    # deployment_status run's subject follows the deployment's ref, so post-deploy
    # runs stay with the release process, which waits on them.
    # continue-on-error: the smoke job alone decides the run's conclusion, so a
    # reporting failure never turns a dispatched release check red; a lost
    # report pages through the missing-heartbeat alarm instead.
    needs: smoke
    continue-on-error: true
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::730335616323:role/github-actions-scheduled-checks
          role-session-name: jsolly-website-production-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1
      # Fails this job when it reports a smoke failure.
      - name: Report to shared-infra scheduled checks
        env:
          SMOKE_JOB_RESULT: ${{ needs.smoke.result }}
          SMOKE_RELEASE_SHA: ${{ needs.smoke.outputs.release-sha }}
        run: node monitoring/production-smoke-report.mjs
