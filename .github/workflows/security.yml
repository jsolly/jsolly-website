name: Security
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  security:
    # Preserve the repository's explicit maintenance opt-in for Dependabot.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ow-ci')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.9.12
      - name: Secrets, workflows, infrastructure, source and dependencies
        run: python3 scripts/security-scan.py ci
