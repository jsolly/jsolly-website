# Repository-owned opt-in Vercel Previews. Automatic branch Git deploys stay off.
# Automatic requests and tooling use main. PR sources are uploaded as data only.
# Agents trigger Preview deployments only when John asks.

name: Vercel Preview

'on':
  issue_comment: # zizmor: ignore[dangerous-triggers] -- Authorized member request only; trusted main tooling uploads PR source as inert data. See docs/development.md.
    types: [created]
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- Same-repo opt-in, trusted main tooling and inert source upload; never executes PR code with credentials.
    branches: [main]
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to deploy as a Preview
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  # Decides whether this event is a real deploy request and resolves the PR
  # head. It holds no Vercel token and no concurrency group, so an LGTM
  # comment, a quoted `/preview` or an unrelated label never displaces a
  # pending deploy.
  resolve:
    name: resolve
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.base.ref == github.event.repository.default_branch &&
        github.event.pull_request.state == 'open' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]' &&
        contains(github.event.pull_request.labels.*.name, 'preview') &&
        (github.event.action != 'labeled' || github.event.label.name == 'preview')
      ) ||
      (
        github.event.issue.pull_request &&
        github.event.comment.user.type == 'User' &&
        contains(github.event.comment.body, '/preview') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    env:
      EVENT_NAME: ${{ github.event_name }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      EVENT_PR: ${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}
      REPO: ${{ github.repository }}
    outputs:
      skip: ${{ steps.pr.outputs.skip }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate the Preview request
        id: pr
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "issue_comment" ]] &&
            ! printf '%s' "$COMMENT_BODY" | bash scripts/vercel-preview-comment.sh; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$EVENT_PR" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid PR number' >&2; exit 1; }
          {
            echo "pr_number=${EVENT_PR}"
            echo "skip=false"
          } >>"$GITHUB_OUTPUT"

  preview:
    permissions:
      contents: read
      pull-requests: write
    name: preview
    needs: resolve
    if: ${{ needs.resolve.outputs.skip == 'false' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    # Only real deploys reach this group. Cancelling in-flight runs would abort
    # a deploy mid-upload. Resolve the latest eligible head inside this slot
    # so out-of-order pending requests cannot discard a newer head.
    concurrency:
      group: vercel-preview-${{ needs.resolve.outputs.pr_number }}
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: team_T8yHg0aDz7nCbyBgJh5a2saR
      VERCEL_PROJECT_ID: prj_9irfTPLYZwwuC7YK0oB3bkc1QXtW
      REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
      EVENT_PR: ${{ needs.resolve.outputs.pr_number }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # Keep PR-controlled package-manager files out of setup-node's cwd. A
      # yarnPath can execute during yarn --version even with caching disabled.
      - name: Check out workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false

      - name: Resolve the pull request head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/tooling/scripts/vercel-preview-resolve.sh"

      # No package-manager cache: the label path's cache scope is one PR code
      # writes in CI, and a restored ~/.npm could plant the npx vercel package
      # or an untracked vercel.* config in this token-holding job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tooling/.nvmrc
          package-manager-cache: false

      - name: Check out PR sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The resolver exports only a validated immutable commit, never a branch ref.
          ref: ${{ steps.pr.outputs.commit_sha }}
          path: source
          persist-credentials: false

      - name: Deploy the Preview
        id: deploy
        working-directory: ${{ runner.temp }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.commit_sha }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          LABELED: ${{ steps.pr.outputs.labeled }}
          SOURCE_DIR: ${{ github.workspace }}/source
        run: bash "$GITHUB_WORKSPACE/tooling/scripts/vercel-preview-deploy.sh"
