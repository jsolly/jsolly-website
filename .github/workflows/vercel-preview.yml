# GitHub Vercel Preview template — opt-in CLI Preview (automatic Git Preview is off)
# Copy to .github/workflows/vercel-preview.yml and:
#   1. Replace prj_9irfTPLYZwwuC7YK0oB3bkc1QXtW with the Vercel project id
#   2. Copy vercel-preview-comment.sh, vercel-preview-comment-contract.sh, and
#      vercel-preview-workflow-contract.sh into scripts/
#   3. Merge vercel.git.deploymentEnabled.json into vercel.json
#   4. Add GitHub secret VERCEL_TOKEN (leftover: do not invent a token)
#   5. Create the label: gh label create preview -R <owner/repo> \
#        --description 'Redeploy a Vercel Preview on every push'
# VERCEL_ORG_ID is the jsolly team (team_T8yHg0aDz7nCbyBgJh5a2saR).
# CLI pin: vercel@59.20.0 (copied from GeoRoids PR 604 — do not invent a version).
#
# Opt-in Preview deploys. Automatic Git Preview builds are off in vercel.json.
# Same-repo owner/member/collaborator User comments `/preview` on a PR, or runs this
# workflow with a PR number: a one-shot deploy. Adding the `preview` label to a
# same-repo PR deploys it and redeploys on every push until the label is removed.
# GitHub runs no pull_request workflow while the PR has a merge conflict, so
# label redeploys pause until the conflict is resolved.
# Requires GitHub secret VERCEL_TOKEN.
# issue_comment runs the workflow file from the default branch; pull_request
# runs it from the PR head, which already holds secrets for same-repo PRs.
# Agents trigger previews only when John asks; never use the label or dispatch unasked.

name: Vercel Preview

'on':
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to deploy as a Preview
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  # Decides whether this event is a real deploy request and resolves the PR
  # head. It holds no Vercel token and no concurrency group, so an LGTM
  # comment, a quoted `/preview` or an unrelated label never displaces a
  # pending deploy.
  resolve:
    name: resolve
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.state == 'open' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]' &&
        contains(github.event.pull_request.labels.*.name, 'preview') &&
        (github.event.action != 'labeled' || github.event.label.name == 'preview')
      ) ||
      (
        github.event.issue.pull_request &&
        github.event.comment.user.type == 'User' &&
        contains(github.event.comment.body, '/preview') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    env:
      EVENT_NAME: ${{ github.event_name }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      EVENT_PR: ${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}
      REPO: ${{ github.repository }}
    outputs:
      skip: ${{ steps.pr.outputs.skip }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      labeled: ${{ steps.pr.outputs.labeled }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve the pull request head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/vercel-preview-resolve.sh

  preview:
    name: preview
    needs: resolve
    if: ${{ needs.resolve.outputs.skip == 'false' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    # Only real deploys reach this group. Cancelling in-flight runs would abort
    # a deploy mid-upload; a burst of pushes still collapses, since GitHub
    # keeps one pending run per group.
    concurrency:
      group: vercel-preview-${{ needs.resolve.outputs.pr_number }}
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: team_T8yHg0aDz7nCbyBgJh5a2saR
      VERCEL_PROJECT_ID: prj_9irfTPLYZwwuC7YK0oB3bkc1QXtW
      REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
      HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
      HEAD_REF: ${{ needs.resolve.outputs.head_ref }}
      LABELED: ${{ needs.resolve.outputs.labeled }}
    steps:
      # Keep PR-controlled package-manager files out of setup-node's cwd. A
      # yarnPath can execute during yarn --version even with caching disabled.
      - name: Check out workflow tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false

      # No package-manager cache: the label path's cache scope is one PR code
      # writes in CI, and a restored ~/.npm could plant the npx vercel package
      # or an untracked vercel.* config in this token-holding job.
      - uses: actions/setup-node@v6
        with:
          node-version-file: tooling/.nvmrc
          package-manager-cache: false

      - name: Check out PR sources
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          path: source
          persist-credentials: false

      - name: Deploy the Preview
        id: deploy
        working-directory: ${{ runner.temp }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_DIR: ${{ github.workspace }}/source
        run: bash "$GITHUB_WORKSPACE/tooling/scripts/vercel-preview-deploy.sh"
